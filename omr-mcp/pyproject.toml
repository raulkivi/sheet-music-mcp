[project]
name = "omr-mcp"
version = "0.2.1"
description = "MCP server for Optical Music Recognition — converts sheet music images to MusicXML"
readme = "README.md"
authors = [
    { name = "Raul Kivi", email = "raulkivi@users.noreply.github.com" },
]
license = { text = "MIT" }
keywords = ["mcp", "music", "omr", "optical-music-recognition", "musicxml", "sheet-music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0,<3.0.0",
    "oemer>=0.1.0",
    # oemer's own packaging leaves onnxruntime-gpu and opencv-python-headless
    # unpinned, so `uv sync` resolves both to whatever is newest. Two
    # constraints keep oemer's bundled models actually runnable:
    #   - onnxruntime: versions newer than ~1.19 enforce stricter ONNX
    #     shape-inference that rejects the ConvTranspose negative-pad values
    #     baked into oemer's exported checkpoints. onnx_compat.py rewrites
    #     those pads into the equivalent output_padding after download (needs
    #     the `onnx` package), so current releases work, including the first
    #     ones with Python 3.13/3.14 wheels. The plain (CPU) build is
    #     used instead of onnxruntime-gpu because the GPU build's older
    #     wheels request an executable stack that current kernels refuse to
    #     map, and because we force CPU-only inference anyway (see
    #     CUDA_VISIBLE_DEVICES in omr_engine.py) since the CUDA execution
    #     provider has been observed to hard-crash (native abort, not a
    #     catchable exception) when the driver's CUDA runtime doesn't match
    #     the onnxruntime-gpu build.
    #   - opencv-python-headless: oemer's own bbox.py assumes the pre-5.x
    #     cv2.HoughLinesP() return shape; opencv 5.x changed it, causing an
    #     "invalid index to scalar variable" crash during staffline
    #     extraction on every input.
    "onnxruntime>=1.30.0,<2.0.0",
    "onnx>=1.17.0,<2.0.0",
    "opencv-python-headless==4.14.0.94",
    "Pillow>=10.0.0",
    "defusedxml>=0.7.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
omr-mcp = "omr_mcp.server:main"

[project.urls]
Homepage = "https://github.com/raulkivi/sheet-music-mcp"
Repository = "https://github.com/raulkivi/sheet-music-mcp"
"Bug Tracker" = "https://github.com/raulkivi/sheet-music-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as slow integration tests that require real backends (run with '-m integration')",
]

[tool.uv]
# oemer unconditionally depends on onnxruntime-gpu (unpinned). Both
# onnxruntime and onnxruntime-gpu install into the same `onnxruntime` import
# package, so if both get installed, whichever lands last silently shadows
# the other — which was overwriting our CPU-only onnxruntime
# above with an unpinned onnxruntime-gpu, reintroducing the exec-stack
# import failure. Excluding it here (impossible marker) keeps only our pin
# installed; oemer's `import onnxruntime` still resolves fine since both
# distributions provide the same module.
override-dependencies = ["onnxruntime-gpu; sys_platform == 'never'"]
