[project]
name = "comparer-mcp"
version = "0.3.0"
description = "MCP server for music-aware comparison of MusicXML files"
readme = "README.md"
authors = [
    { name = "Raul Kivi", email = "raulkivi@users.noreply.github.com" },
]
license = { text = "MIT" }
keywords = ["mcp", "musicxml", "diff", "comparison", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "sheet-music-mcp-core>=0.3.0,<0.4.0",
    "mcp>=2.3.0,<3.0.0",
    "music21>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
comparer-mcp = "comparer_mcp.server:main"

[project.urls]
Homepage = "https://github.com/raulkivi/sheet-music-mcp"
Repository = "https://github.com/raulkivi/sheet-music-mcp"
"Bug Tracker" = "https://github.com/raulkivi/sheet-music-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The Diff Viewer HTML is built by ui/ and gitignored (decision D1); artifacts packages it anyway.
artifacts = ["src/comparer_mcp/ui/assets/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as slow integration tests that require real backends (run with '-m integration')",
]

[tool.uv.sources]
sheet-music-mcp-core = { path = "../sheet-music-mcp-core", editable = true }
