[project]
name = "render-mcp"
version = "0.2.0"
description = "MCP server that renders MusicXML to PDF or PNG"
readme = "README.md"
authors = [
    { name = "Raul Kivi", email = "raulkivi@users.noreply.github.com" },
]
license = { text = "MIT" }
keywords = ["mcp", "musicxml", "render", "pdf", "png", "choir", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2.0,<3.0.0",
    "verovio>=3.0.0",
    "cairosvg>=2.7.0",
    "pypdf>=4.0.0",
    "Pillow>=10.0.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
render-mcp = "render_mcp.server:main"

[project.urls]
Homepage = "https://github.com/raulkivi/sheet-music-mcp"
Repository = "https://github.com/raulkivi/sheet-music-mcp"
"Bug Tracker" = "https://github.com/raulkivi/sheet-music-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as slow integration tests that require real backends (run with '-m integration')",
]
