# Fails on invisible Unicode that could hide instructions in MCP tool
# descriptions, prompts and docs read by LLM agents.
name: Unicode smuggling guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raulkivi/unicode-smuggling-guard@13588d8d6fc2848b2e61b04a8187a306f38d37e5 # v1.0.1
