# publish.yml — publishes one server to PyPI (Trusted Publishing) and the
# MCP Registry (GitHub OIDC), selected by the tag prefix. The shared library
# sheet-music-mcp-core is published to PyPI only: it is not an MCP server.
# render-mcp tags also build the ui/ workspace first, so the wheel ships
# score-viewer.html (built in CI, never committed).
#
# ONE-TIME SETUP (per server, on PyPI):
#   1. Create an account at https://pypi.org and log in.
#   2. For each server package, go to:
#      https://pypi.org/manage/account/publishing/
#   3. Click "Add a new publisher" and fill in:
#      - PyPI project name:  e.g. omr-mcp
#      - GitHub owner:       raulkivi
#      - Repository name:    sheet-music-mcp
#      - Workflow filename:  publish.yml
#      - Environment name:   pypi
#   4. Repeat for each of the seven packages:
#      omr-mcp, synth-mcp, render-mcp, musicxml-abc-mcp, pitch-mcp, comparer-mcp,
#      sheet-music-mcp-core
#
#   Full guide: https://docs.pypi.org/trusted-publishers/
#   The MCP Registry needs no setup: GitHub OIDC proves the io.github.raulkivi/* namespace,
#   and the `mcp-name:` marker in each README proves ownership of the PyPI package.
#
# PUBLISHING A RELEASE:
#   pitch-mcp and render-mcp first need manual evidence on the commit you tag (job `evidence`,
#   tools/release-evidence/README.md): record it, then git push origin refs/notes/release-evidence.
#   Bump the version in pyproject.toml, __init__.py, uv.lock and server.json (servers
#   only), then
#   push a tag matching the server prefix, one tag per push, e.g.:
#     git tag omr-mcp/v0.2.1 && git push origin omr-mcp/v0.2.1

name: Publish

on:
  push:
    tags:
      - "omr-mcp/v*"
      - "synth-mcp/v*"
      - "render-mcp/v*"
      - "musicxml-abc-mcp/v*"
      - "pitch-mcp/v*"
      - "comparer-mcp/v*"
      - "sheet-music-mcp-core/v*"

permissions:
  contents: read

jobs:
  # Release gate (R7/R8, docs/research/ui-and-sound-testing-plan.md P7): a release of pitch-mcp
  # needs the owner's real-microphone run (suite pitch-mic), a release of render-mcp the Claude
  # Desktop host checklist (suite claude-desktop-host), recorded as a git note under
  # refs/notes/release-evidence on the tagged commit. Other packages are not gated (the mapping
  # lives in tools/release-evidence/src/release_evidence/suites.py). Runs in its own job with no
  # id-token, before anything is built or published. See tools/release-evidence/README.md.
  evidence:
    name: Release evidence for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check release evidence
        run: |
          package="${GITHUB_REF_NAME%%/v*}"
          # Standard library only; --no-dev installs nothing.
          evidence() { uv run --project tools/release-evidence --frozen --no-dev release-evidence "$@"; }
          suite="$(evidence suite-for "$package")"
          if [ -z "$suite" ]; then
            echo "$package releases are not gated on manual evidence."
            exit 0
          fi
          # The repository is public, so the fetch needs no token.
          if ! git fetch --no-tags origin refs/notes/release-evidence:refs/notes/release-evidence; then
            echo "::error title=No release evidence::Couldn't fetch refs/notes/release-evidence from origin. Record the $suite suite on this commit, then git push origin refs/notes/release-evidence. See tools/release-evidence/README.md."
            exit 1
          fi
          evidence check --suite "$suite" HEAD

  publish:
    name: Publish ${{ github.ref_name }}
    needs: evidence
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: 1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve server from tag
        id: tag
        run: |
          echo "server=${GITHUB_REF_NAME%%/v*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME##*/v}" >> "$GITHUB_OUTPUT"
          # Only MCP servers have a server.json and go to the MCP Registry.
          if [ "${GITHUB_REF_NAME%%/v*}" = "sheet-music-mcp-core" ]; then
            echo "mcp_server=false" >> "$GITHUB_OUTPUT"
          else
            echo "mcp_server=true" >> "$GITHUB_OUTPUT"
          fi
      # Fails before anything is uploaded if a version file was not bumped.
      - name: Check tag matches package and server.json versions
        working-directory: ${{ steps.tag.outputs.server }}
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          MCP_SERVER: ${{ steps.tag.outputs.mcp_server }}
        run: |
          python3 -c 'import sys, tomllib; v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; sys.exit(v != sys.argv[1] and f"pyproject.toml has {v}")' "$VERSION"
          if [ "$MCP_SERVER" = "true" ]; then
            jq -e --arg v "$VERSION" '.version == $v and all(.packages[]; .version == $v)' server.json
          fi
      # The wheel packages the built Score Viewer page, which is not in git. This job can mint
      # publishing tokens, so no npm cache (poisoning) and no dependency install scripts.
      - name: Set up Node
        if: steps.tag.outputs.server == 'render-mcp'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build UI
        if: steps.tag.outputs.server == 'render-mcp'
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run copy-assets
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build
        working-directory: ${{ steps.tag.outputs.server }}
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ steps.tag.outputs.server }}/dist/
      - name: Install mcp-publisher
        if: steps.tag.outputs.mcp_server == 'true'
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish to MCP Registry
        if: steps.tag.outputs.mcp_server == 'true'
        working-directory: ${{ steps.tag.outputs.server }}
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          # The registry reads the new release's README from PyPI, which can lag the upload.
          for attempt in 1 2 3 4 5; do
            "$RUNNER_TEMP/mcp-publisher" publish && exit 0
            echo "Attempt $attempt failed; retrying in 30 s"
            sleep 30
          done
          exit 1
