# publish.yml — PyPI Trusted Publishing workflow
#
# ONE-TIME SETUP (per server, on PyPI):
#   1. Create an account at https://pypi.org and log in.
#   2. For each server package, go to:
#      https://pypi.org/manage/account/publishing/
#   3. Click "Add a new publisher" and fill in:
#      - PyPI project name:  e.g. omr-mcp
#      - GitHub owner:       raulkivi
#      - Repository name:    sheet-music-mcp
#      - Workflow filename:  publish.yml
#      - Environment name:   pypi
#   4. Repeat for each of the six packages:
#      omr-mcp, synth-mcp, render-mcp, musicxml-abc-mcp, pitch-mcp, comparer-mcp
#
#   Full guide: https://docs.pypi.org/trusted-publishers/
#
# PUBLISHING A RELEASE:
#   Push a tag matching the server prefix, e.g.:
#     git tag omr-mcp/v0.1.0 && git push origin omr-mcp/v0.1.0

name: Publish to PyPI

on:
  push:
    tags:
      - "omr-mcp/v*"
      - "synth-mcp/v*"
      - "render-mcp/v*"
      - "musicxml-abc-mcp/v*"
      - "pitch-mcp/v*"
      - "comparer-mcp/v*"

jobs:
  publish-omr-mcp:
    name: Publish omr-mcp
    if: startsWith(github.ref, 'refs/tags/omr-mcp/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Build
        working-directory: omr-mcp
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: omr-mcp/dist/

  publish-synth-mcp:
