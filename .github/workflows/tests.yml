name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.server }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Bounds a hung test; the slowest server (omr-mcp) takes about a minute.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: [comparer-mcp, musicxml-abc-mcp, omr-mcp, pitch-mcp, render-mcp, sheet-music-mcp-core, synth-mcp]
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Overrides .python-version files, some of which name a local pyenv env.
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: ${{ matrix.server }}/uv.lock
      - run: uv sync --frozen --extra dev
      # Integration tests need real OMR/audio backends; they run locally with -m integration.
      - run: uv run --frozen --no-sync pytest -q -m "not integration"
