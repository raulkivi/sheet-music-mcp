version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /comparer-mcp
      - /musicxml-abc-mcp
      - /omr-mcp
      - /pitch-mcp
      - /render-mcp
      - /synth-mcp
    schedule:
      interval: monthly
    # Waits out the window in which compromised releases are usually yanked.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    # One PR per server per kind of update, instead of one per package.
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      dependencies:
        applies-to: version-updates
        patterns: ['*']
    ignore:
      # opencv 5.x changed cv2.HoughLinesP()'s return shape, which crashes
      # oemer's staffline extraction (omr-mcp). Unit tests do not cover this.
      - dependency-name: opencv-python-headless
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
