version: 2
updates:
  - package-ecosystem: uv
    directories:
      - /comparer-mcp
      - /musicxml-abc-mcp
      - /omr-mcp
      - /pitch-mcp
      - /render-mcp
      - /synth-mcp
    schedule:
      interval: monthly
    # Waits out the window in which compromised releases are usually yanked.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    # One PR per server per kind of update, instead of one per package.
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      dependencies:
        applies-to: version-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
