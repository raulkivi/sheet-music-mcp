[project]
name = "synth-mcp"
version = "0.1.3"
description = "MCP server that synthesizes audio from MusicXML with selectable voice parts and tempo control"
readme = "README.md"
authors = [
    {name = "Raul Kivi", email = "raulkivi@users.noreply.github.com"},
]
license = {text = "MIT"}
keywords = ["mcp", "music", "musicxml", "synthesis", "choir", "audio", "fluidsynth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20.0",
    "mcp>=2.2.0,<3.0.0",
    "music21>=9.0.0",
    "pyfluidsynth>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
synth-mcp = "synth_mcp.server:main"

[project.urls]
Homepage = "https://github.com/raulkivi/sheet-music-mcp"
Repository = "https://github.com/raulkivi/sheet-music-mcp"
"Bug Tracker" = "https://github.com/raulkivi/sheet-music-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as slow integration tests that require real backends (run with '-m integration')",
]
