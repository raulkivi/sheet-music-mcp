<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice Coach</title>
<script src="./support.js"></script>

    },
    {

  "frames": [
    {

      "sung_pitch_hz": 311.1,
      "accuracy_cents": 6,

    },
    {
      "measure": 9,

      "expected_note": "E♭4",

    {

    {

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width:100%;min-height:820px;box-sizing:border-box;background:{{t.bg}};color:{{t.text}};font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column">
  <div style="height:3px;background:linear-gradient(#0072ce 0 33.33%,#15171c 33.33% 66.66%,{{t.flagWhite}} 66.66% 100%)"></div>
  <header style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:{{t.panel}};border-bottom:1px solid {{t.border}}">
    <strong style="font-size:16px">Practice Coach</strong>
    <span style="font-size:12px;color:{{t.muted}}">{{headerLabel}}</span>
    <span style="margin-left:auto;font-size:12px;padding:2px 8px;border-radius:999px;background:{{listenBg}};color:{{listenText}}">{{listenLabel}}</span>
    <button type="button" aria-pressed="{{ dark }}" onClick="{{ toggleDark }}" style="min-height:40px;padding:6px 14px;border:1px solid {{t.muted}};border-radius:6px;background:{{t.bg}};color:{{t.text}}">{{darkLabel}}</button>
  </header>
  <div role="toolbar" aria-label="Session controls" style="display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 16px;border-bottom:1px solid {{t.border}}">
    <button type="button" onClick="{{ toggleListen }}" style="min-width:150px;min-height:40px;padding:6px 14px;border-radius:6px;border:1px solid {{t.accent}};background:{{t.accent}};color:#ffffff;font-weight:600">{{listenButton}}</button>
    <button type="button" onClick="{{ stopAndSummarise }}" style="min-height:40px;padding:6px 14px;border-radius:6px;border:1px solid {{t.muted}};background:{{t.bg}};color:{{t.text}}">Stop and see summary</button>
    <span style="width:1px;align-self:stretch;background:{{t.border}}"></span>
    <div role="group" aria-label="Part" style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{parts}}" as="p">
        <button type="button" aria-pressed="{{ p.on }}" onClick="{{ p.pick }}" style="min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid {{t.muted}};background:{{p.bg}};color:{{t.text}}">{{p.name}}</button>
      </sc-for>
    </div>
  </div>
  <main style="flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;padding:16px;align-items:start">
    <section aria-label="Score with singing cursor" style="min-width:0;padding:12px;background:{{t.panel}};border:1px solid {{t.border}};border-radius:10px">
      <svg viewBox="0 0 600 170" role="img" aria-label="Score excerpt, cursor at bar {{cursorBar}}" style="display:block;width:100%;height:auto;color:{{t.text}}">
        <path d="M20 40H580M20 50H580M20 60H580M20 70H580M20 80H580" stroke="currentColor" stroke-width="1" fill="none"/>
        <path d="M96 80V50M150 70V40M206 65V35M262 60V30M340 80V50M396 70V40M452 65V35M508 60V30" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <g fill="currentColor">
          <ellipse cx="90" cy="80" rx="6" ry="4.5"/><ellipse cx="144" cy="70" rx="6" ry="4.5"/><ellipse cx="200" cy="65" rx="6" ry="4.5"/><ellipse cx="256" cy="60" rx="6" ry="4.5"/>
          <ellipse cx="334" cy="80" rx="6" ry="4.5"/><ellipse cx="390" cy="70" rx="6" ry="4.5"/><ellipse cx="446" cy="65" rx="6" ry="4.5"/><ellipse cx="502" cy="60" rx="6" ry="4.5"/>
        </g>
        <path d="{{cursorPath}}" stroke="{{t.marker}}" stroke-width="2.5" fill="none"/>
      </svg>
      <p style="margin:8px 0 0;font-size:12px;color:{{t.muted}};font-variant-numeric:tabular-nums">{{cursorLine}}</p>
    </section>
    <aside aria-label="Pitch now" style="padding:12px;background:{{t.panel}};border:1px solid {{t.border}};border-radius:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:{{t.muted}}">You sang</span>
        <span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{statusBg}};color:{{statusText}}">{{statusBadge}}</span>
      </div>
      <p style="margin:8px 0 2px;font-size:32px;font-weight:700;line-height:1.1">{{hzLabel}}</p>
      <p style="margin:0 0 12px;font-size:14px;color:{{t.muted}};font-variant-numeric:tabular-nums">{{centsLabel}}</p>
      <div role="img" aria-label="Pitch meter: {{centsLabel}}" style="position:relative;height:56px;border:1px solid {{t.muted}};border-radius:6px;background:{{t.bg}}">
        <span style="position:absolute;top:0;bottom:0;left:40%;width:20%;background:{{t.tint}}"></span>
        <span style="position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:{{t.marker}}"></span>
        <span style="position:absolute;top:6px;bottom:6px;left:{{needle}}%;width:4px;margin-left:-2px;background:{{t.text}};border-radius:2px"></span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:{{t.muted}};margin-top:4px"><span>−50</span><span>0</span><span>+50</span></div>
      <h2 style="margin:16px 0 8px;font-size:14px">Last 3 bars</h2>
      <ul style="list-style:none;margin:0;padding:0">
        <sc-for list="{{history}}" as="h">
          <li style="display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid {{t.border}}">
            <span style="min-width:56px;font-variant-numeric:tabular-nums">Bar {{h.bar}}</span>
            <span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:{{h.bg}};color:{{h.text}}">{{h.label}}</span>
          </li>
        </sc-for>
      </ul>
      <p style="margin:12px 0 0;font-size:12px;color:{{t.muted}}">Cents and status are read aloud when they change, not on every update.</p>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
const FIX = JSON.parse(document.getElementById('fixture').textContent);
// Server states from pitch-mcp frame_status: on_pitch, sharp, flat, uncertain, no_signal.
const STATE_WORD = { on_pitch: 'In tune', sharp: 'Sharp', flat: 'Flat', uncertain: 'Uncertain', no_signal: 'No signal' };
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state || {};
      if (!s.listening) return;
      this.setState({ tick: (s.tick || 0) + 1 });
    }, 700);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const s = this.state || {};
    const dark = !!s.dark;
    const listening = !!s.listening;
    const tick = s.tick || 0;
    const part = s.part || FIX.session.part_id;
    const LIGHT = { bg: '#ffffff', panel: '#f4f6fa', text: '#15171c', muted: '#4b5563', border: '#d5dce6', accent: '#0072ce', marker: '#b7850f', tint: '#eaf2fb', flagWhite: '#ffffff', okTint: '#e4f2e8', okText: '#1e6b3a', warnTint: '#fbf0d2', warnText: '#7a5300', badTint: '#f9e3e1', badText: '#a8322d' };
    const DARK = { bg: '#101217', panel: '#1a1e27', text: '#eef2f7', muted: '#b4bdcb', border: '#2e3645', accent: '#0072ce', marker: '#f2c14e', tint: '#1b2b40', flagWhite: '#101217', okTint: '#17301f', okText: '#8fd3a4', warnTint: '#3a2d0c', warnText: '#f2c14e', badTint: '#3a1c1a', badText: '#f09a94' };
    const t = dark ? DARK : LIGHT;
    // Tone per server state: amber for a wrong or doubtful note, red for a far-off reading.
    const tone = {
      on_pitch: { bg: t.okTint, text: t.okText },
      sharp: { bg: t.warnTint, text: t.warnText },
      flat: { bg: t.warnTint, text: t.warnText },
      uncertain: { bg: t.tint, text: t.muted },
      no_signal: { bg: t.tint, text: t.muted },
    };
    // The prototype replays the fixture's frames in order, so every run looks the same.
    const frames = FIX.frames;
    const frame = listening ? frames[tick % frames.length] : null;
    const status = frame ? frame.status : 'idle';
    const st = status === 'idle'
      ? { word: 'Stopped', badge: 'Stopped', bg: t.tint, text: t.muted }
      : { word: 'Listening', badge: STATE_WORD[status], bg: tone[status].bg, text: tone[status].text };
    const parts = FIX.parts.map((p) => ({
      name: p.name,
      on: part === p.id,
      bg: part === p.id ? t.tint : 'transparent',
      pick: () => this.setState({ part: p.id }),
    }));
    const history = FIX.history.map((h) => ({
      bar: h.measure,
      label: STATE_WORD[h.status] + (h.beat ? ' on beat ' + h.beat : ''),
      bg: tone[h.status].bg,
      text: tone[h.status].text,
    }));
    const [m0, m1] = FIX.measures;
    const cursorBar = frame ? frame.measure : m0;
    const beat = frame ? frame.beat : 1;
    const hasPitch = !!frame && frame.sung_pitch_hz !== null;
    const cents = hasPitch ? frame.accuracy_cents : null;
    const needle = cents === null ? 50 : 50 + Math.max(-50, Math.min(50, cents)) / 50 * 20;
    const centsLabel = !frame
      ? 'Not listening'
      : cents === null
        ? 'No pitch to measure'
        : (cents >= 0 ? '+' : '') + cents + ' cents · ' + (Math.abs(cents) <= 10 ? 'in tune' : cents < 0 ? 'flat' : 'sharp');
    const span = m1 - m0 + 1;
    return {
      t,
      flagWhite: t.flagWhite,
      dark,
      darkLabel: dark ? 'Light theme' : 'Dark theme',
      toggleDark: () => this.setState({ dark: !dark }),
      headerLabel: FIX.session.part_name + ' · bars ' + m0 + ' to ' + m1 + ' · ' + st.word,
      listening,
      listenLabel: listening ? 'Listening' : 'Not listening',
      listenBg: listening ? t.okTint : t.tint,
      listenText: listening ? t.okText : t.muted,
      listenButton: listening ? 'Pause' : 'Start listening',
      toggleListen: () => this.setState({ listening: !listening }),
      stopAndSummarise: () => this.setState({ listening: false }),
      statusWord: st.word,
      statusBadge: st.badge,
      statusBg: st.bg,
      statusText: st.text,
      parts,
      history,
      cursorBar,
      cursorLine: 'Bar ' + cursorBar + ' · beat ' + beat + ' · expected ' + (frame ? frame.expected_note : FIX.frames[0].expected_note),
      cursorPath: 'M' + (20 + (cursorBar - m0) * (560 / span) + (beat - 1) * 25 + 40) + ' 26V92',
      noteName: frame ? frame.expected_note : '',
      hzLabel: hasPitch ? frame.sung_pitch_hz.toFixed(1) + ' Hz' : '–',
      centsLabel,
      needle,
    };
  }
}
</script>
</body>
</html>
