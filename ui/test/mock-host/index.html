<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock MCP Apps host</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #888; }
      #frame-box { margin: 16px; width: 1000px; max-width: calc(100vw - 32px); }
      iframe { display: block; width: 100%; height: 400px; border: 0; background: transparent; }
      /* Fullscreen display mode: the view fills the window (host-page.ts). */
      body.fullscreen { overflow: hidden; }
      body.fullscreen #frame-box { margin: 0; width: 100vw !important; max-width: none; }
      body.fullscreen iframe { height: 100vh !important; }
    </style>
  </head>
  <body>
    <div id="frame-box"></div>
    <script type="module" src="/host.js"></script>
  </body>
</html>
