[project]
name = "release-evidence"
version = "0.1.0"
description = "Evidence records for sheet-music-mcp's manual release checks (git notes), and the release gate that reads them. Not published."
requires-python = ">=3.12"
license = { text = "MIT" }
# Standard library only: the release workflow runs it with --no-dev, so nothing is installed
# into the job that gates a publish.
dependencies = []

[project.scripts]
release-evidence = "release_evidence.cli:main"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/release_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
